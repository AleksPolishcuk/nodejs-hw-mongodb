tags:
  - Contacts
summary: Get paginated list of contacts
operationId: getContacts
description: |
  Retrieve a paginated list of contacts with filtering, sorting, and pagination options.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Number of items per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [_id, name, email, phoneNumber, contactType, createdAt]
      default: _id
    description: Field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contact type
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter by favorite status
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
            page:
              type: integer
              example: 1
            perPage:
              type: integer
              example: 10
            totalItems:
              type: integer
              example: 45
            totalPages:
              type: integer
              example: 5
  '401':
    $ref: '../../components/responses/401.yaml'
