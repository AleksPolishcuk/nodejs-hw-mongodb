tags:
  - Authentication
summary: Register a new user
security: []
operationId: registerUser
description: Create a new user account
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 30
            example: 'Jane Smith'
          email:
            type: string
            format: email
            example: 'jane.smith@example.com'
          password:
            type: string
            minLength: 6
            example: 'securePassword123'
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user
            data:
              $ref: '../../../components/schemas/user.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '409':
    description: Email already in use
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/error.yaml'
        examples:
          conflict:
            value:
              status: 409
              message: 'Email in use'
