tags:
  - Authentication
summary: User login
security: []
operationId: loginUser
description: Authenticate user and return access/refresh tokens
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: 'jane.smith@example.com'
          password:
            type: string
            example: 'securePassword123'
responses:
  '200':
    description: Login successful
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: JWT access token (valid for 15 minutes)
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    headers:
      Set-Cookie:
        schema:
          type: string
        description: Sets refreshToken and sessionId cookies (HttpOnly)
  '401':
    description: Invalid credentials
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/error.yaml'
        examples:
          unauthorized:
            value:
              status: 401
              message: 'Unauthorized'
