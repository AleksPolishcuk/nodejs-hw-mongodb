tags:
  - Authentication
summary: Confirm Google OAuth2 authorization
operationId: loginWithGoogle
description: |
  Exchange Google OAuth2 authorization code for access token.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            description: Authorization code from Google OAuth2 redirect
            example: 'AHHtOjlRYZ7orscmQJXtHlC5B9w2sa4+Spwk7c6U'
responses:
  '200':
    description: Successfully authenticated with Google
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in via Google OAuth!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: JWT access token for API requests
    headers:
      Set-Cookie:
        schema:
          type: string
        description: Sets refreshToken and sessionId cookies (HttpOnly)
  '401':
    description: Invalid or expired authorization code
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/error.yaml'
