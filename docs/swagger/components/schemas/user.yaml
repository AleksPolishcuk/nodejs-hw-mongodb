type: object
required:
  - _id
  - name
  - email
properties:
  _id:
    description: 'Unique user identifier'
    type: string
    example: '65ca67e7ae7f10c88b598799'
  name:
    description: "User's full name"
    type: string
    example: 'Jane Smith'
  email:
    description: "User's email address"
    type: string
    format: email
    example: 'jane.smith@example.com'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
